[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
ticonnect-core = { path = "crates/core" }
ticonnect-logging = { path = "crates/logging" }
ticonnect-settings = { path = "crates/settings" }
ticonnect-net = { path = "crates/net" }
ticonnect-media = { path = "crates/media" }
ticonnect-desktop = { path = "crates/desktop" }
ticonnect-daemon = { path = "crates/daemon" }
ticonnect-runtime = { path = "crates/runtime" }
ticonnect-ui = { path = "crates/ui" }
ticonnect-overlay = { path = "crates/overlay" }
ticonnect-cli = { path = "crates/cli" }

tokio = "1"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
postcard = { version = "1", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
figment = { version = "0.10", features = ["env", "toml"] }
directories = "6"
blake3 = "1"
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hex = "0.4"
notify = "7"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.42", features = ["bundled"] }
uuid = { version = "1", features = ["rng", "v7"] }
mdns-sd = "0.21"
if-addrs = "0.15"
ksni = "0.3"
socket2 = "0.6"
spake2 = "0.4"
subtle = "2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
x509-parser = { version = "0.18", features = ["verify"] }
