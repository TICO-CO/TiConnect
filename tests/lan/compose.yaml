x-node: &node
  image: "${LAN_TEST_IMAGE:-ticonnect-lan-test:local}"
  build:
    context: ../..
    dockerfile: tests/lan/Dockerfile
  networks:
    - lan
  stop_grace_period: 5s
  environment: &node-env
    TICONNECT_CONFIG_DIR: /data/config
    TICONNECT_DATA_DIR: /data/data
    TICONNECT_LOG_LEVEL: "${LAN_TEST_LOG_LEVEL:-debug}"
    TICONNECT_LOG_FILE: /data/ticonnect.log
    LAN_TEST_DISCOVERY_ENABLED: "${LAN_TEST_DISCOVERY_ENABLED:-}"
    LAN_TEST_DISCOVERY_MDNS: "${LAN_TEST_DISCOVERY_MDNS:-}"
    LAN_TEST_DISCOVERY_BROADCAST: "${LAN_TEST_DISCOVERY_BROADCAST:-}"
    LAN_TEST_BEACON_INTERVAL_SECS: "${LAN_TEST_BEACON_INTERVAL_SECS:-1}"
    LAN_TEST_TRANSPORT_PORT: "${LAN_TEST_TRANSPORT_PORT:-}"
    LAN_TEST_READ_RECEIPTS_ENABLED: "${LAN_TEST_READ_RECEIPTS_ENABLED:-}"
    LAN_TEST_DND_ENABLED: "${LAN_TEST_DND_ENABLED:-}"
    LAN_TEST_OUTBOX_TTL_DAYS: "${LAN_TEST_OUTBOX_TTL_DAYS:-}"

services:
  node-a:
    <<: *node
    hostname: node-a
    environment:
      <<: *node-env
      LAN_TEST_DISPLAY_NAME: "${LAN_TEST_DISPLAY_NAME_A:-node-a}"
    volumes:
      - node-a-data:/data

  node-b:
    <<: *node
    hostname: node-b
    environment:
      <<: *node-env
      LAN_TEST_DISPLAY_NAME: "${LAN_TEST_DISPLAY_NAME_B:-node-b}"
    volumes:
      - node-b-data:/data

networks:
  lan:
    driver: bridge

volumes:
  node-a-data:
  node-b-data:
