[package]
name = "ticonnect-daemon"
description = "TiConnect background daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ticonnectd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ticonnect-core.workspace = true
ticonnect-logging.workspace = true
ticonnect-settings.workspace = true
ticonnect-net.workspace = true
ticonnect-media.workspace = true
ticonnect-desktop.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
zbus.workspace = true
