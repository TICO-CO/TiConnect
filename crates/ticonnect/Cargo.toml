[package]
name = "ticonnect"
description = "TiConnect unified executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ticonnect"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ticonnect-cli.workspace = true
ticonnect-overlay.workspace = true
ticonnect-runtime.workspace = true
ticonnect-ui.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
