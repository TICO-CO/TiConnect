[[systems]]
id = "CLI"
name = "Command-line client"
owner = "ticonnect-cli"
layer = "clients"
stage = 2
doc = "23-cli.md"
purpose = "Own command parsing, daemon IPC client, settings client, output formats, and debugging commands."
boundary = "Client process. Talks to daemon over D-Bus and settings directly. No storage or network access."
owned_state = []
interfaces = ["status", "version", "ping", "quit", "id", "settings", "peers", "discover", "pair", "send", "messages", "mark-read", "policy"]
failure_semantics = ["daemon absent exits non-zero", "typed errors printed once", "JSON output stable"]
