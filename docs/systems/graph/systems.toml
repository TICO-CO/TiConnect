[[systems]]
id = "TRAY"
name = "Tray"
owner = "ticonnect-daemon"
layer = "clients"
stage = 6
doc = "22-tray.md"
purpose = "Own StatusNotifierItem icon, menu, policy actions, activation, and unavailable-tray fallback."
boundary = "Runs inside the daemon. Calls policy and IPC. Does not own policy state."
owned_state = ["tray item state"]
interfaces = ["ksni StatusNotifierItem", "menu actions", "DND toggle", "peer policy submenu"]
failure_semantics = ["daemon works without tray", "menu actions map to policy errors", "no headless dependency"]
