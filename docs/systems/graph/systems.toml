[[systems]]
id = "ASR"
name = "Assurance and packaging"
owner = "workspace"
layer = "assurance"
stage = 1
doc = "24-assurance.md"
purpose = "Own test harnesses, fakes, private D-Bus, two-node loopback, CI gates, dependency checks, migration matrix, fuzz, benchmarks, threat model, and packaging validation."
boundary = "Cross-cutting verification. Observes and tests all systems. Ships no runtime feature."
owned_state = ["test fixtures", "benchmark results"]
interfaces = ["cargo test", "cargo xtask systems --check", "cargo audit", "systemd-analyze security", "Flatpak build"]
failure_semantics = ["CI fails on drift", "fuzz target must never panic", "benchmarks record environment", "no secrets in artifacts"]
