name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libasound2-dev libwayland-dev wayland-protocols meson ninja-build pkg-config cmake file libgdk-pixbuf-2.0-dev libglib2.0-bin librsvg2-bin desktop-file-utils appstream systemd jq

      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell -Dintrospection=false -Dvapi=false
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build unified binary
        run: cargo build --locked --release --bin ticonnect

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar -czf "dist/ticonnect-${TAG}-linux-x86_64.tar.gz" -C target/release ticonnect
          ls -lh dist/

      - name: Validate user surface
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="ticonnect") | .version')"
          echo "tag version:       ${TAG_VERSION}"
          echo "workspace version: ${WORKSPACE_VERSION}"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "version mismatch: tag ${TAG_VERSION} vs Cargo ${WORKSPACE_VERSION}" >&2
            exit 1
          fi
          target/release/ticonnect --version
          target/release/ticonnect --help
          desktop-file-validate packaging/flatpak/org.ticonnect.TiConnect.desktop
          appstreamcli validate --no-net packaging/flatpak/org.ticonnect.TiConnect.metainfo.xml
          units="$(mktemp -d)"
          for unit in packaging/systemd/*.service; do
            sed 's|@BINDIR@|$PWD/target/release|g' "$unit" > "$units/$(basename "$unit")"
          done
          systemd-analyze --user verify "$units"/*.service
          if target/release/ticonnect --help | grep -E '^[[:space:]]*(daemon|overlay|cli)\b'; then
            echo "internal command exposed in user help" >&2
            exit 1
          fi

      - name: Download appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

      - name: Build AppImage
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGETOOL_EXTRACT_RUN: "1"
        run: scripts/package-appimage.sh target/release/ticonnect "${GITHUB_REF_NAME}" dist

      - name: Validate AppImage
        run: scripts/smoke-appimage.sh dist/ticonnect-*.AppImage

      - name: AppImage install smoke
        run: |
          APP=$(ls dist/*.AppImage)
          TMP_HOME="$(mktemp -d)"
          export HOME="$TMP_HOME"
          export XDG_CONFIG_HOME="$TMP_HOME/.config"
          export XDG_DATA_HOME="$TMP_HOME/.local/share"
          export XDG_STATE_HOME="$TMP_HOME/.local/state"
          export TICONNECT_INSTALL_NO_SYSTEMD=1
          APPIMAGE="$PWD/$APP" "$APP" --appimage-extract-and-run --install-user
          test -x "$TMP_HOME/.local/bin/ticonnect"
          test -f "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"
          desktop-file-validate "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"
          "$TMP_HOME/.local/bin/ticonnect" --version
          dbus-run-session -- bash -c '
            set -euo pipefail
            "$HOME/.local/bin/ticonnect" status
            "$HOME/.local/bin/ticonnect" quit
          '
          TICONNECT_INSTALL_ASSUME_YES=1 "$TMP_HOME/.local/bin/ticonnect" --uninstall-user --purge
          test ! -e "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"

      - name: Build and validate Arch package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker run --rm --entrypoint /bin/bash \
            -e TAG="$TAG" \
            -v "$PWD:/src:ro" \
            -v "$PWD/dist:/out" \
            archlinux:latest -c '
              set -euo pipefail
              export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              pacman -Syu --noconfirm --needed fakeroot binutils debugedit gtk4 webkit2gtk-6.0 gtk4-layer-shell alsa-lib glib2
              useradd -m builder
              su builder -c "cd /tmp && mkdir -p /home/builder/out && /src/scripts/package-arch.sh /src/dist/ticonnect-${TAG}-linux-x86_64.tar.gz \"${TAG}\" /home/builder/out"
              cp /home/builder/out/*.pkg.tar.zst /out/
              pacman -U --noconfirm --needed /out/ticonnect-*.pkg.tar.zst
              /usr/bin/ticonnect --help >/dev/null
              test -f /usr/share/applications/org.ticonnect.TiConnect.desktop
              test -f /etc/xdg/autostart/ticonnect.desktop
              test -f /etc/xdg/autostart/ticonnect-overlay.desktop
              test -f /usr/lib/systemd/user/ticonnectd.service
            '

      - name: Drop internal tarball
        run: rm -f dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ticonnect-${{ github.ref_name }}-linux
          path: |
            dist/*.AppImage
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ticonnect-${{ github.ref_name }}-linux
          merge-multiple: true

      - name: Checksums
        run: |
          (cd dist && sha256sum *.AppImage *.pkg.tar.zst > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.pkg.tar.zst
            dist/SHA256SUMS.txt
          generate_release_notes: true
