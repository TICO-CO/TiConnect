name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libasound2-dev libwayland-dev wayland-protocols meson ninja-build pkg-config git cmake xvfb desktop-file-utils appstream systemd

      - name: Build gtk4-layer-shell
        run: |
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell -Dintrospection=false -Dvapi=false
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build binaries
        run: cargo build --workspace --bins

      - name: Packaging validation
        run: |
          desktop-file-validate packaging/flatpak/org.ticonnect.TiConnect.desktop
          appstreamcli validate --no-net packaging/flatpak/org.ticonnect.TiConnect.metainfo.xml
          units="$(mktemp -d)"
          for unit in packaging/systemd/*.service; do
            sed "s|@BINDIR@|$PWD/target/debug|g" "$unit" > "$units/$(basename "$unit")"
          done
          systemd-analyze --user verify "$units"/*.service
          target/debug/ticonnect --help
          target/debug/ticonnect --version
          if target/debug/ticonnect --help | grep -E '^[[:space:]]*(daemon|overlay|cli)\b'; then
            echo "internal command exposed in user help" >&2
            exit 1
          fi

      - name: Installer smoke
        run: |
          TMP_HOME="$(mktemp -d)"
          export HOME="$TMP_HOME"
          export XDG_CONFIG_HOME="$TMP_HOME/.config"
          export XDG_DATA_HOME="$TMP_HOME/.local/share"
          export TICONNECT_INSTALL_NO_SYSTEMD=1
          target/debug/ticonnect --install-user
          test -x "$TMP_HOME/.local/bin/ticonnect"
          test -f "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"
          test -f "$TMP_HOME/.config/systemd/user/ticonnectd.service"
          test -f "$TMP_HOME/.config/autostart/ticonnect.desktop"
          desktop-file-validate "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"
          Xvfb :98 -screen 0 1280x720x24 >/tmp/xvfb-install.log 2>&1 &
          export DISPLAY=:98
          timeout 8 gtk-launch org.ticonnect.TiConnect || true
          pkill -f "$TMP_HOME/.local/share/ticonnect/app/ticonnect" || true
          TICONNECT_INSTALL_ASSUME_YES=1 "$TMP_HOME/.local/bin/ticonnect" --uninstall-user --purge
          test ! -e "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"

      - name: Build AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool APPIMAGETOOL_EXTRACT_RUN=1 \
            scripts/package-appimage.sh target/debug/ticonnect ci dist

      - name: AppImage install smoke
        run: |
          APP=$(ls dist/*.AppImage)
          TMP_HOME="$(mktemp -d)"
          export HOME="$TMP_HOME"
          export XDG_CONFIG_HOME="$TMP_HOME/.config"
          export XDG_DATA_HOME="$TMP_HOME/.local/share"
          export XDG_STATE_HOME="$TMP_HOME/.local/state"
          export TICONNECT_INSTALL_NO_SYSTEMD=1
          APPIMAGE="$PWD/$APP" "$APP" --appimage-extract-and-run --install-user
          test -x "$TMP_HOME/.local/bin/ticonnect"
          desktop-file-validate "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"
          "$TMP_HOME/.local/bin/ticonnect" --version
          dbus-run-session -- bash -c '
            set -euo pipefail
            "$HOME/.local/bin/ticonnect" status
            "$HOME/.local/bin/ticonnect" quit
          '
          TICONNECT_INSTALL_ASSUME_YES=1 "$TMP_HOME/.local/bin/ticonnect" --uninstall-user --purge
          test ! -e "$TMP_HOME/.local/share/applications/org.ticonnect.TiConnect.desktop"

      - name: Architecture graph
        run: cargo xtask systems --check

      - name: Test
        run: dbus-run-session -- cargo test --workspace --all-targets

      - name: Set up Bun
        if: hashFiles('crates/ui/web/package.json') != ''
        uses: oven-sh/setup-bun@v2

      - name: Web dependencies
        if: hashFiles('crates/ui/web/package.json') != ''
        working-directory: crates/ui/web
        run: bun install --frozen-lockfile

      - name: Web check
        if: hashFiles('crates/ui/web/package.json') != ''
        working-directory: crates/ui/web
        run: bun run format:check && bun run lint && bun run check && bun run test

      - name: Web build
        if: hashFiles('crates/ui/web/package.json') != ''
        working-directory: crates/ui/web
        run: bun run build

      - name: Web assets freshness
        if: hashFiles('crates/ui/web/package.json') != ''
        run: git diff --exit-code crates/ui/assets

      - name: Local X11 integration
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          tests/local/run.sh x11 messaging
          tests/local/run.sh x11 attachments
          tests/local/run.sh x11 ui
          tests/local/run.sh x11 remote

      - name: Audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  lan-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Run two-container LAN test
        run: make lan-test
