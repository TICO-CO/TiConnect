name: Tag

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'v')) ||
      (github.event_name == 'push' &&
       (contains(github.event.head_commit.message, ' from ') ||
        contains(github.event.head_commit.message, 'Merge branch ') ||
        contains(github.event.head_commit.message, 'Merge remote-tracking branch ')))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PUSH_MSG: ${{ github.event.head_commit.message }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="$PR_BRANCH"
            SHA="$PR_SHA"
          else
            BRANCH=""
            SHA="$PUSH_SHA"
            if printf '%s\n' "$PUSH_MSG" | grep -Eq '^Merge pull request #[0-9]+ from [^/]+/(.+)$'; then
              BRANCH="$(printf '%s\n' "$PUSH_MSG" | sed -nE 's|^Merge pull request #[0-9]+ from [^/]+/(.+)$|\1|p' | head -n1)"
            elif printf '%s\n' "$PUSH_MSG" | grep -Eq "^Merge branch '(.+)' into main$"; then
              BRANCH="$(printf '%s\n' "$PUSH_MSG" | sed -nE "s|^Merge branch '(.+)' into main$|\1|p" | head -n1)"
            elif printf '%s\n' "$PUSH_MSG" | grep -Eq "^Merge remote-tracking branch 'origin/(.+)'"; then
              BRANCH="$(printf '%s\n' "$PUSH_MSG" | sed -nE "s|^Merge remote-tracking branch 'origin/(.+)'.*$|\1|p" | head -n1)"
            fi
          fi
          BRANCH="${BRANCH#refs/heads/}"
          if ! printf '%s' "$BRANCH" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "no release branch: '${BRANCH:-<none>}'"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release tag: $BRANCH @ $SHA"

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.tag != ''
        with:
          ref: ${{ steps.resolve.outputs.sha || github.sha }}
          fetch-depth: 0

      - name: Create tag
        if: steps.resolve.outputs.tag != ''
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists, skipping"
            exit 0
          fi
          VERSION="$(sed -nE 's|^version = "([^"]+)"$|\1|p' Cargo.toml | head -n1)"
          echo "tag version:       ${TAG#v}"
          echo "workspace version: $VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "version mismatch: tag $TAG vs Cargo $VERSION" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "${{ steps.resolve.outputs.sha || github.sha }}"
          git push origin "refs/tags/$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
